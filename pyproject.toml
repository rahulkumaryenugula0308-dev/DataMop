[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "datamop"
version = "0.2.0"

description = "Automatic data cleaning, analysis, visualization and reporting library"

readme = "README.md"

requires-python = ">=3.10"

authors = [
    {name = "DataMop Development Team"}
]

dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "openpyxl"
]


[project.optional-dependencies]

dev = [
    "pytest"
]

web = [
    "streamlit"
]


[tool.setuptools.packages.find]
include = [
    "datamop*"
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]